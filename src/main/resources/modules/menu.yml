# Menu Module
menu:
  enabled: true
  commands:
    menu:
      enabled: true

# Define your menus here.
# Each menu needs a unique name (kebab-case works best). Items are placed by
# slot index. Titles, names and lore support MiniMessage and PlaceholderAPI
# placeholders (if PlaceholderAPI is installed).
menus:
  example:
    title: "<yellow>Example Menu"
    size: 27 # 9, 18, 27, 36, 45 or 54
    fill-material: GRAY_STAINED_GLASS_PANE # optional: fills all empty slots
    items:
      '11':
        material: RED_BED
        name: "<red><bold>Spawn"
        lore:
          - "<gray>Teleports you to the"
          - "<gray>spawn location."
        sound: "BLOCK_NOTE_BLOCK_PLING" # optional: sound effect on click
        message: "<green>You have been teleported to spawn!" # shown to the clicking player
        close: true # optional: close the menu after clicking
        commands: # executed as the player, %player% supported
          - "spawn"

# DO NOT EDIT BELOW UNLESS YOU KNOW WHAT YOU ARE DOING
version: 1.0