name: Build

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK 25 (Temurin)
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 25
          cache: maven

      - name: Build with Maven
        run: mvn -B -ntp --no-transfer-progress clean verify

      - name: Verify packaged resources
        run: |
          JAR=$(ls target/PlainBase-*.jar)
          echo "JAR=$JAR"
          fail=0

          # Resource filtering must have resolved ${version} / ${project.description}...
          if ! unzip -p "$JAR" paper-plugin.yml | grep -q "version: '0.3.0-Beta'"; then
            echo "::error::Check failed: paper-plugin.yml version was not filtered to 0.3.0-Beta"; fail=1
          fi
          if ! unzip -p "$JAR" paper-plugin.yml | grep -q "description: The lightweight all-in-one core"; then
            echo "::error::Check failed: paper-plugin.yml description was not filtered"; fail=1
          fi
          # ...and no unresolved placeholder may remain.
          if unzip -p "$JAR" paper-plugin.yml | grep -q '\${'; then
            echo "::error::Check failed: unresolved \${...} placeholder left in paper-plugin.yml"; fail=1
          fi
          # Vanilla target selectors in the shipped configs must survive
          # resource filtering untouched.
          if ! unzip -p "$JAR" modules/team.yml | grep -q '@a\[team=pb_team1\]'; then
            echo "::error::Check failed: team.yml target selector '@a[team=...]' missing"; fail=1
          fi
          # Shaded runtime deps must be present and relocated.
          if ! unzip -l "$JAR" | grep -q 'de/jgaertig/plainBase/libs/gson'; then
            echo "::error::Check failed: gson not relocated under de/jgaertig/plainBase/libs/gson"; fail=1
          fi
          if ! unzip -l "$JAR" | grep -q 'de/jgaertig/plainBase/libs/hikari'; then
            echo "::error::Check failed: hikari not relocated under de/jgaertig/plainBase/libs/hikari"; fail=1
          fi
          if ! unzip -l "$JAR" | grep -q 'org/sqlite/JDBC.class'; then
            echo "::error::Check failed: sqlite driver missing from shaded jar"; fail=1
          fi

          echo "--- paper-plugin.yml (as packaged) ---"
          unzip -p "$JAR" paper-plugin.yml
          echo "--- fail=$fail ---"
          exit $fail

      - name: Upload plugin jar
        uses: actions/upload-artifact@v6
        with:
          name: PlainBase-jar
          path: target/PlainBase-*.jar
          if-no-files-found: error
